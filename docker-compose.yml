services:
  lead-radar:
    build: .
    container_name: lead-radar
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Taipei
      DB_PATH: /data/radar.db
    ports:
      # Bind only to the explicitly configured LAN address (defaults to localhost).
      - "${LAN_BIND_IP:-127.0.0.1}:8010:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
