services:
  lead-radar:
    build: .
    container_name: lead-radar
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Taipei
      DB_PATH: /data/radar.db
      FACEBOOK_RUNNER_URL: http://facebook-runner:9090
      FACEBOOK_MIN_JOB_INTERVAL_MINUTES: 30
    ports:
      # Bind only to the explicitly configured LAN address (defaults to localhost).
      - "${LAN_BIND_IP:-127.0.0.1}:8010:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  facebook-runner:
    build:
      context: ../facebook-public-group-scraper-standalone
      dockerfile: Dockerfile
    container_name: facebook-group-runner
    restart: unless-stopped
    init: true
    entrypoint: ["node"]
    command: ["scripts/runner-server.mjs"]
    environment:
      TZ: Asia/Taipei
      RUNNER_PORT: 9090
      OUTPUT_ROOT: /app/output
      MONITOR_OUTPUT_ROOT: /app/monitor-output
      STATE_ROOT: /app/state
    volumes:
      - ./data/facebook-output:/app/output
      - ./data/facebook-monitor-output:/app/monitor-output
      - ./data/facebook-state:/app/state
      - ./data/facebook-cookies:/app/cookies:ro
    expose:
      - "9090"
